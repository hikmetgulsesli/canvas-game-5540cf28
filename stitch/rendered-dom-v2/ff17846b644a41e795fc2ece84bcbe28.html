<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans selection:bg-indigo-500 selection:text-white">
  <!-- Route Root Surface: SURF_PLAY_PAGE -->
  <div data-surface-id="SURF_PLAY_PAGE" class="flex-1 flex flex-col min-h-screen" data-setfarm-element-ref="E000001">
    <!-- Top Decorative Header Bar (Non-actionable) -->
    <header class="border-b border-slate-800 bg-slate-900/60 backdrop-blur px-8 py-4 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center font-black text-white text-lg shadow-lg shadow-indigo-500/30">
          C
        </div>
        <div>
          <span class="text-base font-bold tracking-tight text-white">Canvas Game</span>
          <span class="ml-2 text-xs font-semibold px-2 py-0.5 rounded bg-indigo-950 text-indigo-400 border border-indigo-800/60">Arcade Arena</span>
        </div>
      </div>

      <!-- Observable Status Metrics -->
      <div class="flex items-center space-x-6">
        <!-- High Score Observable -->
        <div class="flex items-center space-x-2 bg-slate-800/80 px-4 py-1.5 rounded-lg border border-slate-700/60">
          <span class="text-xs uppercase tracking-wider font-semibold text-slate-400">High Score</span>
          <div role="status" aria-label="High score" class="text-sm font-bold text-amber-400 tabular-nums" data-setfarm-element-ref="E000002"></div>
        </div>

        <!-- Game Status Observable -->
        <div class="flex items-center space-x-2 bg-slate-800/80 px-4 py-1.5 rounded-lg border border-slate-700/60">
          <span class="text-xs uppercase tracking-wider font-semibold text-slate-400">Status</span>
          <div role="status" aria-label="Game status" class="text-sm font-medium text-emerald-400" data-setfarm-element-ref="E000003"></div>
        </div>
      </div>
    </header>

    <!-- Main Workspace -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-8 flex flex-col items-center justify-center">
      <div class="w-full max-w-4xl bg-slate-900 rounded-2xl border border-slate-800 p-6 shadow-2xl flex flex-col items-center">
        <!-- Contained Surface: SURF_GAME_CANVAS -->
        <div data-surface-id="SURF_GAME_CANVAS" class="w-full aspect-[16/9] max-h-[520px] bg-slate-950 rounded-xl border border-slate-800/90 relative overflow-hidden flex flex-col items-center justify-center shadow-inner" data-setfarm-element-ref="E000004">
          <!-- Subtle decorative grid pattern inside canvas -->
          <div class="absolute inset-0 opacity-15 bg-[radial-gradient(#6366f1_1px,transparent_1px)] [background-size:24px_24px]"></div>

          <!-- Canvas graphic decorative elements -->
          <div class="relative z-10 flex flex-col items-center text-center px-4">
            <div class="w-20 h-20 rounded-2xl bg-indigo-950/70 border border-indigo-500/30 flex items-center justify-center text-indigo-400 mb-4 shadow-lg shadow-indigo-500/10">
              <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
              </svg>
            </div>
            <h2 class="text-xl font-bold text-white mb-1">Canvas Arena Ready</h2>
            <p class="text-sm text-slate-400 max-w-sm">Press start below to enter the game arena, dodge obstacles, and set the high score.</p>
          </div>
        </div>

        <!-- Controls Toolbar Container on SURF_PLAY_PAGE -->
        <div class="mt-6 w-full flex items-center justify-between border-t border-slate-800/80 pt-6 px-2">
          <div class="flex items-center space-x-2 text-xs text-slate-400">
            <span class="inline-block w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
            <span>Desktop Display 60 FPS</span>
          </div>

          <!-- Physical Control Slot: CSLOT_START_GAME_START_BUTTON -->
          <button type="button" data-action="ACT_START_GAME" data-control-slot="CSLOT_START_GAME_START_BUTTON" class="px-8 py-3 bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-700 text-white font-semibold text-sm rounded-xl shadow-lg shadow-indigo-600/30 transition-all flex items-center space-x-2 cursor-pointer focus:outline-none focus:ring-2 focus:ring-indigo-400 focus:ring-offset-2 focus:ring-offset-slate-900" data-setfarm-element-ref="E000005">
            <span>Start</span>
          </button>
        </div>
      </div>
    </main>

    <!-- Footer Decorative Chrome (Non-actionable) -->
    <footer class="border-t border-slate-800/60 py-4 px-8 text-center text-xs text-slate-400">
      <span>Canvas Game Environment © All rights reserved.</span>
    </footer>
  </div>


</body></html>
